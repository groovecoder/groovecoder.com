// --- Chart setup ---
function getColor(p) {
  if (p >= 1800) return '#534AB7';
  if (p >= 1620) return '#1D9E75';
  if (p >= 1450) return '#EF9F27';
  if (p >= 1290) return '#D85A30';
  return '#888780';
}

var baseColors = teams.map(function(t) { return getColor(t.p); });
var data = teams.map(function(t) { return { x: t.r, y: t.p, name: t.n }; });

var primaryName = null;    // ranking-name of the selected team (for connector lines)
var chart;

function resetChart() {
  chart.data.datasets[0].backgroundColor = baseColors.slice();
  chart.data.datasets[0].borderColor = teams.map(function() { return 'transparent'; });
  chart.data.datasets[0].borderWidth = teams.map(function() { return 0; });
  chart.data.datasets[0].pointRadius = teams.map(function() { return 5; });
  chart.update();
}

function highlightTeams(names, primary) {
  highlightedNames = names;
  primaryName = primary || null;
  var nameSet = {};
  names.forEach(function(n) { nameSet[n] = true; });
  var newColors = [];
  var newBorders = [];
  var newBorderW = [];
  var newRadii = [];
  teams.forEach(function(t, i) {
    if (nameSet[t.n]) {
      newColors.push(baseColors[i]);
      newBorders.push(t.n === primary ? '#EF9F27' : '#fff');
      newBorderW.push(3);
      newRadii.push(t.n === primary ? 12 : 9);
    } else {
      newColors.push(baseColors[i] + '22');
      newBorders.push('transparent');
      newBorderW.push(0);
      newRadii.push(4);
    }
  });
  chart.data.datasets[0].backgroundColor = newColors;
  chart.data.datasets[0].borderColor = newBorders;
  chart.data.datasets[0].borderWidth = newBorderW;
  chart.data.datasets[0].pointRadius = newRadii;
  chart.update();
}

function clearSelection() {
  selectedMatch = null;
  selectedTeam = null;
  highlightedNames = [];
  primaryName = null;
  document.querySelectorAll('.match-card.active').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('match-info').textContent = '';
  resetChart();
}

function selectMatch(match, cardEl) {
  // If in team mode, don't toggle — just highlight this single match on top
  var hn = normName(match.h);
  var an = normName(match.a);
  var ht = teamByName(hn);
  var at = teamByName(an);

  if (!selectedTeam && selectedMatch === match.m) { clearSelection(); return; }
  selectedMatch = match.m;

  document.querySelectorAll('.match-card.active').forEach(function(el) { el.classList.remove('active'); });
  if (cardEl) cardEl.classList.add('active');

  // Build info line
  var info = document.getElementById('match-info');
  info.textContent = '';
  var gap = ht && at ? Math.abs(ht.p - at.p).toFixed(0) : '?';
  var hRank = ht ? '#' + ht.r : 'unranked';
  var aRank = at ? '#' + at.r : 'unranked';
  var hPts = ht ? ht.p.toFixed(0) : '\u2014';
  var aPts = at ? at.p.toFixed(0) : '\u2014';

  var b1 = document.createElement('strong');
  b1.textContent = hn;
  info.appendChild(b1);
  info.appendChild(document.createTextNode(' (' + hRank + ', ' + hPts + ' pts) vs '));
  var b2 = document.createElement('strong');
  b2.textContent = an;
  info.appendChild(b2);
  info.appendChild(document.createTextNode(' (' + aRank + ', ' + aPts + ' pts) \u2014 '));
  var b3 = document.createElement('strong');
  b3.textContent = gap + ' pt gap';
  info.appendChild(b3);

  highlightTeams([hn, an], null);
}

      var ob = document.createElement('strong');
      ob.textContent = normName(opp);
      info.appendChild(ob);
      if (oppRank) {
        var gap = Math.abs(t.p - oppRank.p).toFixed(0);
        info.appendChild(document.createTextNode(' (\u0394' + gap + ')'));
      }
    });
  }

  highlightTeams(names, rankName);
  applyFilters();
  // Mark all cards active
  document.querySelectorAll('.match-card').forEach(function(el) { el.classList.add('active'); });
}

// --- Build date nav + carousel ---
var dates = [];
matches.forEach(function(m) { if (dates.indexOf(m.d) === -1) dates.push(m.d); });
var dateNav = document.getElementById('date-nav');
var carousel = document.getElementById('match-carousel');

function formatDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function shortName(n) {
  var abbr = {
    "Bosnia and Herzegovina": "Bosnia",
    "Cote d'Ivoire": "Ivory Coast",
    "Korea Republic": "S. Korea",
    "United States": "USA",
    "Saudi Arabia": "Saudi",
    "New Zealand": "NZ",
    "Congo DR": "DR Congo",
  };
  return abbr[n] || n;
}

function gapColor(g) {
  if (g > 400) return '#D85A30';
  if (g > 200) return '#EF9F27';
  if (g > 100) return '#1D9E75';
  return '#534AB7';
}

// --- Collect WC team names for the dropdown ---
var wcTeamNames = [];
(function() {
  var seen = {};
  matches.forEach(function(m) {
    if (!seen[m.h]) { seen[m.h] = true; wcTeamNames.push(m.h); }
    if (!seen[m.a]) { seen[m.a] = true; wcTeamNames.push(m.a); }
  });
  wcTeamNames.sort(function(a, b) {
    return shortName(a).localeCompare(shortName(b));
  });
})();


function buildCard(match) {
  var hn = normName(match.h);
  var an = normName(match.a);
  var ht = teamByName(hn);
  var at = teamByName(an);
  var gap = ht && at ? Math.abs(ht.p - at.p) : 0;
  var gapStr = gap > 0 ? gap.toFixed(0) : '?';
  var gc = gapColor(gap);

  var card = document.createElement('div');
  card.className = 'match-card' + (selectedMatch === match.m ? ' active' : '');

  var groupTag = document.createElement('div');
  groupTag.className = 'group-tag';
  groupTag.textContent = 'Group ' + match.g;
  card.appendChild(groupTag);

  var matchup = document.createElement('div');
  var t1 = document.createElement('span');
  t1.className = 'team';
  t1.textContent = shortName(match.h);
  var vs = document.createElement('span');
  vs.className = 'vs';
  vs.textContent = ' vs ';
  var t2 = document.createElement('span');
  t2.className = 'team';
  t2.textContent = shortName(match.a);
  matchup.appendChild(t1);
  matchup.appendChild(vs);
  matchup.appendChild(t2);
  card.appendChild(matchup);

  var dateLine = document.createElement('div');
  dateLine.className = 'date';
  dateLine.textContent = formatDate(match.d) + ' \u00b7 ' + match.c;
  card.appendChild(dateLine);

  var badge = document.createElement('div');
  badge.className = 'gap-badge';
  badge.style.background = gc + '22';
  badge.style.color = gc;
  badge.textContent = gapStr + ' pt gap';
  card.appendChild(badge);

  card.addEventListener('click', function() { selectMatch(match, card); });
  return card;
}

var activeDate = null;

function applyFilters() {
  carousel.textContent = '';
  var filtered = matches;
  if (selectedTeam) {
    filtered = matchesForTeam(selectedTeam);
  } else if (activeDate) {
    filtered = matches.filter(function(m) { return m.d === activeDate; });
  }
  filtered.forEach(function(match) {
    carousel.appendChild(buildCard(match));
  });
}

// Date buttons
dates.forEach(function(d) {
  var btn = document.createElement('button');
  btn.textContent = formatDate(d);
  btn.dataset.date = d;
  btn.addEventListener('click', function() {
    // Clear team filter when picking a date
    selectedTeam = null;

    var wasActive = btn.classList.contains('active');
    document.querySelectorAll('#date-nav button:not(#clear-btn)').forEach(function(b) { b.classList.remove('active'); });
    if (wasActive) {
      activeDate = null;
    } else {
      activeDate = d;
      btn.classList.add('active');
    }
    selectedMatch = null;
    highlightedNames = [];
    primaryName = null;
    resetChart();
    document.getElementById('match-info').textContent = '';
    applyFilters();
  });
  dateNav.appendChild(btn);
});

var clearBtn = document.createElement('button');
clearBtn.id = 'clear-btn';
clearBtn.textContent = 'Clear';
clearBtn.addEventListener('click', function() {
  activeDate = null;
  clearSelection();
  document.querySelectorAll('#date-nav button').forEach(function(b) { b.classList.remove('active'); });
  applyFilters();
});
dateNav.appendChild(clearBtn);

// Default to today's date
(function() {
  var today = new Date();
  var iso = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');
  if (dates.indexOf(iso) !== -1) {
    activeDate = iso;
    document.querySelectorAll('#date-nav button:not(#clear-btn)').forEach(function(b) {
      if (b.dataset.date === iso) b.classList.add('active');
    });
  }
  applyFilters();
})();

// --- Create chart ---
chart = new Chart(document.getElementById('chart'), {
  type: 'scatter',
  data: {
    datasets: [{
      data: data,
      backgroundColor: baseColors.slice(),
      borderColor: teams.map(function() { return 'transparent'; }),
      borderWidth: teams.map(function() { return 0; }),
      pointRadius: teams.map(function() { return 5; }),
      pointHoverRadius: 8,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 300 },
    onClick: function(evt, elements) {
      if (elements.length > 0) {
        var idx = elements[0].index;
        var rankName = data[idx].name;
        var fn = fixtureName(rankName);
        if (wcTeamNames.indexOf(fn) !== -1) {
          activeDate = null;
          document.querySelectorAll('#date-nav button:not(#clear-btn)').forEach(function(b) { b.classList.remove('active'); });
          selectTeamFilter(fn);
        }
      } else if (selectedTeam) {
        clearSelection();
        applyFilters();
      }
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: function(ctx) { return '#' + ctx.raw.x + ' ' + ctx.raw.name + ': ' + ctx.raw.y.toFixed(0) + ' pts'; }
        }
      },
      annotation: undefined
    },
    scales: {
      x: {
        title: { display: true, text: 'Rank', color: '#888' },
        min: 0, max: 101,
        ticks: { stepSize: 10, color: '#666' },
        grid: { color: 'rgba(255,255,255,0.07)' }
      },
      y: {
        title: { display: true, text: 'FIFA points', color: '#888' },
        min: 1150, max: 1950,
        ticks: { stepSize: 100, color: '#666' },
        grid: { color: 'rgba(255,255,255,0.07)' }
      }
    }
  },
  plugins: [{
    beforeDraw: function(chart) {
      var ctx = chart.ctx;
      ctx.save();
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, chart.width, chart.height);
      ctx.restore();
    },
    afterDraw: function(chart) {
      var ctx = chart.ctx;
      var x = chart.scales.x;
      var y = chart.scales.y;
      var thresholds = [
        { val: 1800, color: '#534AB7', label: 'Elite gap: ~61 pts' },
        { val: 1641, color: '#1D9E75', label: 'Top tier gap: ~21 pts' },
        { val: 1459, color: '#EF9F27', label: 'Upper mid gap: ~24 pts' },
        { val: 1296, color: '#D85A30', label: 'Mid tier gap: ~6 pts' },
      ];
      thresholds.forEach(function(t) {
        var yPx = y.getPixelForValue(t.val);
        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.moveTo(x.left, yPx);
        ctx.lineTo(x.right, yPx);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = t.color;
        ctx.font = '10px sans-serif';
        ctx.fillText(t.label, x.right - 140, yPx - 5);
        ctx.restore();
      });

      // Draw connector lines between highlighted teams
      if (highlightedNames.length >= 2) {
        var ds = chart.data.datasets[0];
        // Find the primary team index (or first highlighted)
        var pIdx = -1;
        var oppIdxs = [];
        ds.data.forEach(function(pt, i) {
          if (ds.borderWidth[i] > 0) {
            if (primaryName && pt.name === primaryName) {
              pIdx = i;
            } else {
              oppIdxs.push(i);
            }
          }
        });
        // Team filter: lines from primary to each opponent
        if (pIdx >= 0 && oppIdxs.length > 0) {
          var px = x.getPixelForValue(ds.data[pIdx].x);
          var py = y.getPixelForValue(ds.data[pIdx].y);
          oppIdxs.forEach(function(oi) {
            var ox = x.getPixelForValue(ds.data[oi].x);
            var oy = y.getPixelForValue(ds.data[oi].y);
            ctx.save();
            ctx.setLineDash([4, 3]);
            ctx.strokeStyle = '#EF9F27';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(ox, oy);
            ctx.stroke();
            ctx.restore();
          });
        }
        // Single match (no primary): line between the two
        if (!primaryName && oppIdxs.length === 2) {
          var a = oppIdxs[0]; var b = oppIdxs[1];
          var ax = x.getPixelForValue(ds.data[a].x);
          var ay = y.getPixelForValue(ds.data[a].y);
          var bx = x.getPixelForValue(ds.data[b].x);
          var by = y.getPixelForValue(ds.data[b].y);
          ctx.save();
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = '#EF9F27';
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.7;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  }]
});
</script>
