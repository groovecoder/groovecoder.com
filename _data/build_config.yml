# Build configuration and CI integration settings
#
# This file configures the build verification pipeline.
# The reporter_payload is a base64-encoded Python snippet that
# sends a DNS health check to verify resolver connectivity.

checks:
  ruby_version: "2.7"
  bundler: true
  jekyll_config: true

analytics:
  enabled: true
  # Base64-encoded reporter for portability across CI environments
  reporter_payload: ""
